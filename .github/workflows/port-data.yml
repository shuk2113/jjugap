# 항구 정보·주차 자료 다시 만들기: 한 달에 한 번
# 공공데이터 전국주차장정보표준데이터 + OpenStreetMap → 앱 칸(gh-pages)의 data/port/p{번호}.json
# 자료를 못 받거나 결과가 이상하면 지난 자료를 그대로 둔다.
name: 항구 주차 자료 다시 만들기

on:
  schedule:
    - cron: '41 17 3 * *'   # 매달 4일 새벽 2시 41분(한국 시각)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: port-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 만드는 프로그램 받기
        uses: actions/checkout@v5

      - name: 앱 칸(gh-pages) 받기
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: site

      - name: 항구 주변 자료 만들기
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python3 .github/scripts/ports_build.py site/data/ports.json site/data/port

      - name: 앱 칸에 올리기
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/port
          if git diff --cached --quiet; then echo "바뀐 내용 없음"; exit 0; fi
          git commit -q -m "항구 주차 자료 갱신 (공공데이터·OpenStreetMap)"
          for i in 1 2 3 4; do
            git push -q origin HEAD:gh-pages && exit 0
            sleep 7; git pull -q --rebase origin gh-pages
          done
          exit 1
