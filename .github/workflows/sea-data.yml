# 바다 날씨 자료 모으기: 기상청 예보 발표(02·05·08·11·14·17·20·23시) 20분 뒤마다
# 예보·수온을 받아 앱 칸(gh-pages)의 data/weather.json 으로 저장한다.
name: 바다 날씨 자료 모으기

on:
  schedule:
    - cron: '20 2,5,8,11,14,17,20,23 * * *'   # UTC 기준이지만 3시간 간격이라 한국 시각과 같은 시각들
  workflow_dispatch:
    inputs:
      diag:
        description: '연결 점검만 하기'
        type: boolean
        default: false
  push:
    branches: [auto-data]
    paths: ['.github/**']

permissions:
  contents: write

concurrency:
  group: sea-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 수집 프로그램 받기
        uses: actions/checkout@v5

      - name: 앱 칸(gh-pages) 받기
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: site

      - name: 연결 점검
        if: ${{ inputs.diag }}
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python3 .github/scripts/collect.py --diag

      - name: 예보·수온 받기
        if: ${{ !inputs.diag }}
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python3 .github/scripts/collect.py site/data/weather.json

      - name: 앱 칸에 올리기
        if: ${{ !inputs.diag }}
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weather.json
          if git diff --cached --quiet; then echo "바뀐 내용 없음"; exit 0; fi
          git commit -q -m "바다 날씨 자료 갱신"
          for i in 1 2 3; do
            git push -q origin HEAD:gh-pages && exit 0
            sleep 5; git pull -q --rebase origin gh-pages
          done
          exit 1
