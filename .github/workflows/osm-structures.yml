# 지도에 없는 바다 위 방파제·도류제(OpenStreetMap man_made=breakwater|groyne)를 받아 .github/data/osm_breakwaters.json 으로 저장 (손으로만)
# 자료: Geofabrik이 나눠 주는 OpenStreetMap 한국 자료(© OpenStreetMap 기여자, ODbL)에서 골라낸다
name: 지도 방파제 자료 받기

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: 도구 준비
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: 한국 자료 받기
        run: curl -sSfL --retry 3 -o /tmp/kr.osm.pbf https://download.geofabrik.de/asia/south-korea-latest.osm.pbf && ls -la /tmp/kr.osm.pbf
      - name: 방파제만 골라내기
        run: |
          osmium tags-filter /tmp/kr.osm.pbf w/man_made=breakwater,groyne -o /tmp/bw.osm.pbf --overwrite
          osmium export /tmp/bw.osm.pbf -o /tmp/bw.geojsonseq -f geojsonseq --overwrite --add-unique-id=type_id
          python3 - <<'PY'
          import json, os, time
          out = []
          for line in open('/tmp/bw.geojsonseq'):
              line = line.strip().strip('\x1e')
              if not line: continue
              f = json.loads(line); p = f.get('properties', {}); g = f['geometry']
              if p.get('man_made') not in ('breakwater', 'groyne'): continue
              if g['type'] == 'LineString': rings, area = [g['coordinates']], False
              elif g['type'] == 'Polygon': rings, area = [g['coordinates'][0]], True
              elif g['type'] == 'MultiPolygon': rings, area = [pp[0] for pp in g['coordinates']], True
              else: continue
              for c in rings:
                  c = [[round(x, 6), round(y, 6)] for x, y in c]
                  if not any(125.3 <= x <= 127.4 and 35.1 <= y <= 38.1 for x, y in c): continue   # 앱 바다 지도(basemap) 범위
                  out.append({'id': f.get('id') or p.get('@id', ''), 'k': p.get('man_made'), 'area': area, 'name': p.get('name', ''), 'c': c})
          os.makedirs('.github/data', exist_ok=True)
          json.dump({'src': '© OpenStreetMap 기여자 (ODbL) · Geofabrik', 'when': time.strftime('%Y-%m-%d'), 'ways': out}, open('.github/data/osm_breakwaters.json', 'w'), ensure_ascii=False, separators=(',', ':'))
          print('방파제', len(out), '· 점', sum(len(w['c']) for w in out))
          for w in out:
              if '376785391' in str(w['id']): print('비응 앞:', json.dumps(w, ensure_ascii=False))
          PY
      - name: 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/data/osm_breakwaters.json
          git diff --cached --quiet && exit 0
          git commit -m "지도 방파제 자료 (OpenStreetMap)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
