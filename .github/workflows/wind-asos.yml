# 맑은 날 72일의 서해안 시간별 바람 (기상청 ASOS · 바람 방향 확인용 · 손으로만)
name: 지난 바람 받기

on:
  workflow_dispatch:
    inputs:
      days: { description: '날짜들 (쉼표)', default: '' }

permissions:
  contents: write

jobs:
  wind:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: 받기
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          DAYS: ${{ github.event.inputs.days }}
        run: python3 .github/scripts/asos_wind.py
      - name: 저장
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/data/wind || true
          git diff --cached --quiet && exit 0
          git commit -m "지난 바람 (기상청 ASOS)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
